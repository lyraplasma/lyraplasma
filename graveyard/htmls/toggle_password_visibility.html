<!DOCTYPE html>
<html>
  <head>
    <style>
      #toggle_password { cursor: pointer; }
      @keyframes spin {from { transform: rotate(0deg); } to { transform: rotate(360deg); }}
      span { position: relative;}
      .spins { animation: spin ease-in-out infinite;}
      </style>
  </head>
  <body>
    <form action="#">
      <fieldset>
	<legend>Sign In</legend>
	<input type="text" name="username" id="username" />
	<input type="password" name="password" id="password_field" />
	<span style="width: 20px; height: 20px; border-radius: 100%;" id="toggle_password">:3</span>
	<button type="submit" id="submit" class="submit">Log In</button>
      </fieldset>
      </form>
    <script>
      const toggle_password = document.getElementById("toggle_password");
      const password_field = document.getElementById("password_field");
      toggle_password.addEventListener("click", (e) => {
	e.preventDefault(); console.trace(e);
	password_field.setAttribute("type",
				     password_field.getAttribute("type") === "password" ? "text" : "password")
	e.target.classList.toggle("spins");
      });
      document.querySelector("form").addEventListener("submit", (e) => {
	console.trace(e)
	e.preventDefault()
	console.trace(e)	
      });
      </script>
  </body>
</html>
