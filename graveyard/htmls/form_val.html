<!DOCTYPE html><html><head><style>
      .success { color: green; }
      .error { color: red; }
</style></head><body>
<div class="container">
    <form id="signup" class="form" action="#">
      <fieldset>
	<legend>Sign Up</legend>

	<div class="form-field">
	<label for="username">Username:</label><br />
	<input type="text" name="username" id="username" autocomplete="off" />
	<small></small>
	</div>

	<div class="form-field">	
	<label for="email">Email:</label><br />
	<input type="email" id="email" autocomplete="off" />
	<small></small>	
	</div>

	<div class="form-field">	
	<label for="password">Password:</label><br />
	<input type="password" id="password" autocomplete="off"/>
	<small></small>	
	</div>
	
	<div class="form-field">	
	<label for="password_confirmation">Confirm Password:</label><br />
	<input type="password" name="password_confirmation" id="password_confirmation" autocomplete="off" />
	<small></small>	
	</div>

	<div class="form-field">
	  <input type="submit" value="Sign Up"/>
	</div>

      </fieldset>
      </form>
<script>
  const username_el = document.getElementById("username"),
	email_el = document.getElementById("email"),
	password_el = document.getElementById("password"),
	confirm_password_el = document.getElementById("password_confirmation"),
	form = document.getElementById("signup");
  const is_required = value => value === "" ? false : true,
	is_between = (length, min, max) => length < min || length > max ? false : true,
	is_email_valid = email => {
	  const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
	  return re.test(email);
	},
	is_password_secure = password => {
	  const re = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#\$%\^&\*])(?=.(8,})");
	  return re.test(password);
	},
	show_error = (input, message) => {
	  const form_field = input.parentElement;
	  form_field.classList.remove("success");
	  form_field.classList.add("error");
	  form_field.querySelector("small").textContent = message;
	},
	show_success = input => {
	  const form_field = input.parentElement;
	  form_field.classList.remove("error");
	  form_field.classList.add("success");
	  form_field.querySelector("small").textContent = "";
	},
	check_username = () => {
	  let valid = false;
	  const min = 3,
		max = 25,
		username = username_el.value.trim();
	  
	  if (!is_required(username)) {
	    show_error(username_el, "Username cannot be blank");
	  } else if (!is_between(username.length, min, max)) {
	    show_error(username_el, `Username must be between ${min} and ${max} characters.`)
	  } else {
	    show_success(username_el);
	    valid = true;
	  }
	      return valid;
        },
	check_email = () => {
	  let valid = false;
	  const email = email_el.value.trim();
	  if(!is_required(email)) {
	    show_error(email_el, "Email cannot be blank");
	  } else if (!is_email_valid(email)) {
	    show_error(email_el, "Email is not valid.");
	  } else {
	    show_success(email_el);
	    valid = true;
	  }
	  return valid;
	},
	check_password = () => {
	  let valid = false;
	  const password = password_el.value.trim();
	  if (!is_required(password)) {
	    show_error(password_el, "Password cannot be blank.");
	  } else if (!is_password_secure(password)) {
	    show_error(password_el, "Password must has at least 8 characters that include at least 1 lowercase character, 1 uppercase characters, 1 number, and 1 special character in (!@#$%^&*)");
	  } else {
	    show_success(password_el);
	    valid = true;
	  }
	  return valid;
	},
        check_confirm_password() => {
	  let valid = false;
	  const confirm_password = confirm_password_el.value.trim(),
		password = password_el.value.trim();

	  if (!is_required(confirm_password)) {
	    show_error(confirm_password_el, "Please enter the password again");
	  } else if (password !== confirm_password) {
	    show_error(confirm_password_el, "Confirm password does not match");
	  } else {
	    show_success(confirm_password_el);
	    valid = true;
	  }
	};

  const debounce = (fn, delay=500) => {
    let timeout_id;
    return (...args) {
      if (timeout_id) {
	clearTimeout(timeout_id);
      }
      timeout_id = setTimeout(() => {
	fn.apply(null, args)
      }, delay);
    };
  };

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    let is_username_valid = check_username(),
	is_email_valid = check_email(),
	is_password_valid = check_password(),
	is_confirm_password_valid = check_confirm_password(),
	is_form_valid = is_username_valid && is_email_valid && is_password_valid && is_confirm_password_valid;

    if (is_form_valid) {}
  });

  form.addEventListener("input", debounce(function (e) {
    switch (e.target.id) {
    case "username":
      check_username()
      break;
    case "email":
      check_email();
      break;
    case "password":
      check_password();
      break;
    case "confirm_password":
      check_confirm_password();
      break;
    }
  });
</script></body></html>
